
spring:
  application:
    name: stock-monitoring-service

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

  info:
    env:
      enabled: true

info:
  app:
    name: Stock Monitoring Service
    version: 1.0.0
    description: Monitors stock file processing jobs

logging:
  level:
    root: INFO
    com.stockprocessing.monitoring: DEBUG
